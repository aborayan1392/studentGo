name: Build StudentTracker v3.1.5 APK

on:
  push:
    branches:
      - studenttracker-v315-apk-build-20260814
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct v3.1.5 source archive
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          root = Path('v315build')
          b64 = ''
          for n in range(7):
              b64 += (root / f'source_{n:02d}').read_text().strip()
          for name in ['source_07d0','source_07d1','source_07d20','source_07d21','source_07d30','source_07d31']:
              raw = (root / name).read_text().strip()
              b64 += ''.join(chr(int(x)) for x in raw.split(',') if x.strip())
          for n in [8, 9, 10]:
              b64 += (root / f'source_{n:02d}').read_text().strip()
          data = base64.b64decode(b64, validate=True)
          Path('source.tar.xz').write_bytes(data)
          print('archive bytes:', len(data))
          PY
          xz -t source.tar.xz
          mkdir -p project
          tar -xJf source.tar.xz -C project
          SETTINGS="$(find project -name settings.gradle -print -quit)"
          test -n "$SETTINGS"
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          grep -q "versionName '3.1.5'" "$PROJECT_DIR/app/build.gradle"
          grep -q "versionCode 27" "$PROJECT_DIR/app/build.gradle"

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle -p "$PROJECT_DIR" --no-daemon --stacktrace :app:assembleDebug
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" StudentTrackerNative-v3.1.5.apk
          unzip -t StudentTrackerNative-v3.1.5.apk >/dev/null
          sha256sum StudentTrackerNative-v3.1.5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudentTrackerNative-v3.1.5-APK
          path: StudentTrackerNative-v3.1.5.apk
          if-no-files-found: error
          retention-days: 7
